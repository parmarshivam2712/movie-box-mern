<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Circle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="rgba(245, 158, 11, 0.25)" stroke-width="8"/>

  <!-- Film Clapperboard Body -->
  <g filter="url(#glow)">
    <!-- Base Board -->
    <rect x="100" y="210" width="312" height="202" rx="24" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
    
    <!-- Top Clapper Bar (Angled) -->
    <g transform="rotate(-12, 100, 190)">
      <rect x="90" y="145" width="320" height="54" rx="12" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="10"/>
      <!-- Stripes -->
      <polygon points="130,145 165,145 140,199 105,199" fill="url(#goldGrad)"/>
      <polygon points="210,145 245,145 220,199 185,199" fill="url(#goldGrad)"/>
      <polygon points="290,145 325,145 300,199 265,199" fill="url(#goldGrad)"/>
      <polygon points="370,145 405,145 380,199 345,199" fill="url(#goldGrad)"/>
    </g>

    <!-- Center Play Icon -->
    <polygon points="230,270 310,311 230,352" fill="url(#accentGrad)"/>

    <!-- Glowing Star Badge -->
    <path d="M375,230 L382,246 L399,248 L386,260 L390,277 L375,268 L360,277 L364,260 L351,248 L368,246 Z" fill="#fbbf24"/>
  </g>
</svg>