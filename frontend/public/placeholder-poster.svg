<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" fill="none">
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect x="15" y="15" width="270" height="420" rx="12" stroke="#334155" stroke-dasharray="6 6" stroke-width="2"/>
  
  <g transform="translate(110, 160)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="25" cy="30" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="55" cy="30" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="35,55 45,55 40,65" fill="#f59e0b"/>
  </g>

  <text x="150" y="270" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="700">Movie Box</text>
